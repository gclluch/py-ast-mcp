[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-ast-mcp"
version = "0.2.1"
description = "MCP server for deep structural analysis of Python source via the stdlib ast module"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "py-ast-mcp contributors" }]
keywords = ["mcp", "ast", "python", "static-analysis", "llm", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["mcp>=2.0.0"]

[project.optional-dependencies]
semantic = ["jedi>=0.19"]
# radon is the authority the complexity scores are advertised against, so the
# parity test asks it directly rather than restating numbers that can drift.
dev = ["pytest>=7.4", "jedi>=0.19", "radon>=6.0"]

[project.scripts]
py-ast-mcp = "py_ast_mcp.server:main"

[project.urls]
Homepage = "https://github.com/gclluch/py-ast-mcp"
Issues = "https://github.com/gclluch/py-ast-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Fixtures are inputs, not source: broken.py must not parse, and the others are
# pinned to exact line numbers by the tests. Formatting them breaks both.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# `ruff format` owns line length; the only lines left over are strings it
# cannot split, so E501 would just be noise the formatter can't resolve.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
